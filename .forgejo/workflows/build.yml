on: [push]
jobs:
  build:
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          filter: tree:0
          ref: ${{ github.ref }} # workaround for actions/checkout#1638
      - uses: ./.forgejo/nickeltc
        with:
          args: env QT=5 just build package
      - uses: forgejo/upload-artifact@v5
        with:
          name: KoboRoot.tgz
          path: KoboRoot.tgz

  build-qt6:
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          filter: tree:0
          ref: ${{ github.ref }} # workaround for actions/checkout#1638
      - uses: ./.forgejo/nickeltc-qt6
        with:
          args: just lint build package
      - name: Verify build artifacts
        run: sh test/check_artifacts.sh
      - uses: forgejo/upload-artifact@v5
        with:
          name: NickelStorygraph
          path: |
            hook/Kobo.tgz
            mnt/onboard/.adds/NickelStorygraph/
