# Builds the Qt 6.5.2 Kobo cross toolchain (.forgejo/nickeltc) and publishes
# it to GHCR, so the CI build job can pull it instead of compiling Qt on every
# run. Runs only when the toolchain definition changes, or by hand.
#
# Any branch that touches the toolchain republishes :latest. That keeps a
# toolchain change testable in its own PR; it also means an unmerged toolchain
# branch can replace the image main builds with, so merge or revert promptly.
name: Toolchain image

on:
  push:
    paths:
      - ".forgejo/nickeltc/**"
      - ".github/workflows/toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nickelstorygraph-toolchain

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .forgejo/nickeltc
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository, which lets the CI job pull
          # it with the repository's GITHUB_TOKEN.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kobo/Tolino firmware 5.18+ cross toolchain (Qt 6.5.2, Rust, just, resvg)
          cache-from: type=gha
          cache-to: type=gha,mode=max
