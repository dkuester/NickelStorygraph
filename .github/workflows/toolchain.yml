# Builds the cross toolchains and publishes them to GHCR, so the CI build jobs
# can pull them instead of compiling a toolchain on every run:
#   qt5 — firmware 4.x: NickelTC (Qt 5.2.1) from .forgejo/nickeltc, as upstream
#   qt6 — firmware 5.18+: Qt 6.5.2 from .forgejo/nickeltc-qt6
# Runs only when a toolchain definition changes, or by hand.
#
# Any branch that touches a toolchain republishes its :latest. That keeps a
# toolchain change testable in its own PR; it also means an unmerged toolchain
# branch can replace the image main builds with, so merge or revert promptly.
name: Toolchain image

on:
  push:
    paths:
      - ".forgejo/nickeltc/**"
      - ".forgejo/nickeltc-qt6/**"
      - ".github/workflows/toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: "5"
            context: .forgejo/nickeltc
            image: nickelstorygraph-toolchain-qt5
            description: Kobo firmware 4.x cross toolchain (NickelTC, Qt 5.2.1, Rust, just, resvg)
          - qt: "6"
            context: .forgejo/nickeltc-qt6
            image: nickelstorygraph-toolchain
            description: Kobo/Tolino firmware 5.18+ cross toolchain (Qt 6.5.2, Rust, just, resvg)
    name: image (Qt ${{ matrix.qt }})
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Links the package to this repository, which lets the CI jobs pull
          # it with the repository's GITHUB_TOKEN.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=qt${{ matrix.qt }}
          cache-to: type=gha,mode=max,scope=qt${{ matrix.qt }}
